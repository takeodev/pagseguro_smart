name: pagseguro_smart
description: "Plugin em Flutter para integração com o PlugPagServiceWrapper da PagSeguro."

repository: https://github.com/takeodev/pagseguro_smart
issue_tracker: https://github.com/takeodev/pagseguro_smart/issues
topics:
  - pagseguro
  - pagbank
  - payment
  - pos
  - android
version: 1.4.0

environment:
  # Mínimo real: Color.toARGB32() (usado em setStyleData) existe a partir do Flutter 3.27 / Dart 3.6
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.takeodev.pagseguro_smart
        pluginClass: PlugPagServicePlugin