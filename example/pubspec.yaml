name: example
description: "Exemplo de Utilização do Plugin em Flutter para integração com o PlugPagServiceWrapper da PagSeguro."

publish_to: 'none'
version: 1.1.1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  pagseguro_smart:
    path: ../
  provider: ^6.1.5+1
  flutter_masked_text2: ^0.9.1
  bot_toast: ^4.1.3
  mask_text_input_formatter: ^2.9.0

dev_dependencies:
  #integration_test:
    #sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Gera os ícones do app (Android) a partir do logo do desenvolvedor: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo_takeo.png

# Configuração do flutter_launcher_icons (ícone do App Example com o logo do desenvolvedor)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
